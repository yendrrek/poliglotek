plugins {
    id "groovy"
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "io.micronaut.application" version "4.4.2"
    id "io.micronaut.aot" version "4.4.2"
    id "org.owasp.dependencycheck" version "10.0.4"
    id "com.andrzejpiontek.version-bump" version "0.0.1"
}

version = "0.47.4"
group = "com.transtopolish"

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // micronaut
    implementation "io.micronaut.serde:micronaut-serde-jackson"
    annotationProcessor "io.micronaut.serde:micronaut-serde-processor"
    annotationProcessor "io.micronaut:micronaut-http-validation"
    compileOnly "io.micronaut:micronaut-http-client"
    testImplementation "io.micronaut:micronaut-http-client"

    // lombok
    annotationProcessor "org.projectlombok:lombok:1.18.34"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.34"
    testCompileOnly "org.projectlombok:lombok:1.18.34"
    compileOnly "org.projectlombok:lombok:1.18.34"

    // jsoup
    implementation "org.jsoup:jsoup:1.18.1"

    // google cloud
    implementation "com.google.cloud:google-cloud-translate:2.52.0"

    // snakeyaml
    implementation "org.yaml:snakeyaml:2.0"

    // logback
    runtimeOnly "ch.qos.logback:logback-classic"

    // byte buddy
    testImplementation "net.bytebuddy:byte-buddy:1.14.9"

    // objenesis
    testImplementation "org.objenesis:objenesis:3.4"
}


application {
    mainClass = "com.transtopolish.Application"
}

java {
    sourceCompatibility = JavaVersion.toVersion("21")
    targetCompatibility = JavaVersion.toVersion("21")
}

graalvmNative.toolchainDetection = false

micronaut {
    runtime "netty"
    testRuntime "spock2"
    processing {
        incremental true
        annotations "com.transtopolish.*"
    }
    aot {
        // https://micronaut-projects.github.io/micronaut-aot/latest/guide/
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}

tasks.named("dockerfileNative") {
    jdkVersion = "21"
}

dependencyCheck {
    nvd {
        apiKey = System.getenv("nvdApiKey")
    }
}

tasks.register("installGitHook", Copy) {
    from new File(rootProject.rootDir, "scripts/pre-commit")
    into { new File(rootProject.rootDir, ".git/hooks") }
    fileMode 0755
}

tasks.named("compileJava") {
    dependsOn installGitHook
}

versionBump{ }