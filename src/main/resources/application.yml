micronaut:
  application:
    name: poliglotek
  server:
    cors:
      enabled: true
      configurations:
        default:
          allowedOrigins: ["http://localhost:4200"]

http:
  client:
    read-timeout: 30s

netty:
  default:
    allocator:
      max-order: 3

googleCloud:
  projectId: ${googleCloudProjectId}
  customSearchApiKey: ${googleCustomSearchApiKey}
  customSearchEngineId: ${googleCustomSearchEngineId}

mailgun:
  apiKey: ${mailgunApiKey}
  politlotekEmailTo: poliglotek.translator@gmail.com # todo: move to class
  subjectStaticPart: Poliglotek contact form submitted by # todo: move to class

akismet:
  apiKey: ${akismetApiKey}

excludedSocialMedia: >-
  facebook, twitter, x.com, linkedin, instagram, snapchat, google currents, vkontakte, mastodon, threads, youtube, tiktok, 
  vimeo, twitch, dailymotion, bilibili, triller, pinterest, flickr, deviantart, behance, 500px, reddit, quora, tumblr, 
  stack exchange, github, dribbble, xing, angellist, tinder, bumble, okcupid, hinge, grindr, eharmony, match.com, goodreads, 
  letterboxd, last.fm, myanimelist, ravelry, weibo, qzone, mixi, clubhouse, spotify, anchor.fm, podbean
  
