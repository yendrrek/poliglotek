micronaut:
  application:
    name: poliglotek
  security:
    authentication: idtoken
    oauth2:
      clients:
        google:
          client-id: ${OAUTH_CLIENT_ID}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: "https://accounts.google.com"
    endpoints:
      logout:
        get-allowed: true
  server:
    host: 0.0.0.0
    port: 8080
    cors:
      enabled: true
      configurations:
        default:
          allowedOrigins: ["http://localhost:4200", "http://localhost:8080", "https://www.poliglotek.com"]
          allowedMethods:
            - POST
            - GET
            - PUT
            - DELETE
            - OPTIONS
  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:public/browser

http:
  client:
    read-timeout: 30s

netty:
  default:
    allocator:
      max-order: 3

googleCloud:
  projectId: ${GOOGLE_CLOUD_PROJECT_ID}
  customSearchApiKey: ${GOOGLE_CUSTOM_SEARCH_API_KEY}
  customSearchEngineId: ${GOOGLE_CUSTOM_SEARCH_ENGINE_ID}

mailgunApiKey: ${MAILGUN_API_KEY}

akismet:
  apiKey: ${AKISMET_API_KEY}
