micronaut:
  application:
    name: toPolish
  server:
    cors:
      enabled: true
      configurations:
        default:
          allowedOrigins: ["http://localhost:4200"]

http:
  client:
    read-timeout: 30s

netty:
  default:
    allocator:
      max-order: 3

googleCloud:
  projectId: ${googleCloudProjectId}
  customSearchApiKey: ${googleCustomSearchApiKey}
  customSearchEngineId: ${googleCustomSearchEngineId}

jsoup:
  userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/107.0.0.0 Safari/537.36